; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericAT32F421G8U7]
platform = arterytekat32
board = genericAT32F421G8U7
framework = at32firmlib

; 最后 2 KB (0x0800F800~0x0800FFFF) 留给 eeprom 参数区
board_build.ldscript = linker/AT32F421x8_62K.ld

; Framework driver sources also include "at32f421_conf.h",
; so the project include directory must be visible to them.
; 全局 -Os 节省 Flash；20 kHz 控制相关文件用 #pragma GCC optimize("O2") 保持速度。
build_unflags =
build_flags =
    -Os
    -flto
    -fno-inline-small-functions
    -ffunction-sections
    -fdata-sections
    -fmerge-all-constants
    -Wl,--gc-sections
    -Wl,--allow-multiple-definition
    -Wl,-u,_sbrk
    -Wl,-u,TMR1_BRK_OVF_TRG_HALL_IRQHandler
    -I$PROJECT_INCLUDE_DIR

; 调试串口 PA9=TX / PA10=RX，115200 8N1
monitor_speed = 115200
