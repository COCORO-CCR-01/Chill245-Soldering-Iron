; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericAT32F421G8U7]
platform = arterytekat32
board = genericAT32F421G8U7
framework = at32firmlib

; 最后 2 KB (0x0800F800~0x0800FFFF) 留给 eeprom 参数区
board_build.ldscript = linker/AT32F421x8_62K.ld

; Framework driver sources also include "at32f421_conf.h",
; so the project include directory must be visible to them.
; 20 kHz 控制中断优先速度：默认 -Os 改为 -O2。
build_unflags =
    -Os
build_flags =
    -O2
    -I$PROJECT_INCLUDE_DIR

; 调试串口 PA9=TX / PA10=RX，115200 8N1
monitor_speed = 115200
